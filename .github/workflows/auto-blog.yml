name: Auto Blog Publisher

# Runs weekly on Monday at 10 AM CT (15:00 UTC)
# Also manually triggerable from Actions tab
on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      blog_type:
        description: 'Which blog to generate'
        required: true
        default: 'both'
        type: choice
        options:
          - btc
          - horror
          - both
      custom_topic:
        description: 'Optional custom topic/title'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate blog posts
        env:
          BLOG_TYPE: ${{ github.event.inputs.blog_type || 'both' }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
        run: python scripts/generate_blog.py

      - name: Commit and push
        run: |
          git config user.name "LSV Auto Blog"
          git config user.email "blog@lasciviousvibrationsllc.art"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🖤 Auto-blog: $(date +%Y-%m-%d)"
            git push
          fi
